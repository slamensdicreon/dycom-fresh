<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HomepagePopup — first design</title>
<link rel="stylesheet" href="../dycom-web.css">
<link rel="stylesheet" href="../first-pass.css">
<style>
@font-face { font-family: "Dycom Fjalla"; src: url("../assets/0ac801cd8a8605a3b1b79be409f7f065.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Dycom Geist"; src: url("../assets/571c400347b6b5435347cbda65060bfd.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
body { margin: 0; }
</style>
</head>
<body>
<div class="dy fp-backdrop">
  <img src="/media/photography/web/z9a_4064-1000.webp" alt="">
  <div class="fp-scrim"></div>
  <div class="fp-dialog" role="dialog" aria-modal="true" aria-labelledby="fp-pop">
    <img src="/media/photography/web/z9b_2679-1000.webp" alt="Three crew members in hard hats sharing a laugh">
    <div class="fp-dialog-body">
      <button type="button" class="fp-close" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h2 id="fp-pop">We’re hiring across the country</h2>
      <p>Hundreds of open roles in the trades, with paid training and a local employer. Find the work that fits you.</p>
      <div class="dy-actions"><a class="dy-btn" href="#">Find open roles <svg class="dy-arrow" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a><a class="dy-btn dy-btn--outline" href="#">Not now</a></div>
      <p class="dy-small">Shown once per visit, on the homepage only. Escape or × closes it.</p>
    </div>
  </div>
</div>

<script>document.addEventListener('click', function (e) { if (e.target.closest('a, button')) e.preventDefault(); });</script>
</body>
</html>
